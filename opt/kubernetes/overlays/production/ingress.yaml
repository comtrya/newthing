apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: comtrya-server
  annotations:
    # The server runs with COMTRYA_TLS_TERMINATED=true, so TLS terminates here.
    # Add controller-specific annotations as needed (e.g. cert-manager:
    #   cert-manager.io/cluster-issuer: letsencrypt-prod).
    {}
spec:
  ingressClassName: nginx # REPLACE with your ingress class
  tls:
    - hosts:
        - comtrya.example.com # REPLACE
      secretName: comtrya-tls # TLS cert secret (cert-manager or pre-provisioned)
  rules:
    # REPLACE the host. API/auth/git/extension paths go to the server; everything
    # else falls through to the frontend SPA.
    - host: comtrya.example.com # REPLACE
      http:
        paths:
          - path: /graphql
            pathType: Prefix
            backend:
              service:
                name: comtrya-server
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: comtrya-server
                port:
                  number: 80
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: comtrya-server
                port:
                  number: 80
          - path: /_extensions
            pathType: Prefix
            backend:
              service:
                name: comtrya-server
                port:
                  number: 80
          - path: /git
            pathType: Prefix
            backend:
              service:
                name: comtrya-server
                port:
                  number: 80
          - path: /events
            pathType: Prefix
            backend:
              service:
                name: comtrya-server
                port:
                  number: 80
          - path: /healthz
            pathType: Prefix
            backend:
              service:
                name: comtrya-server
                port:
                  number: 80
          - path: /readyz
            pathType: Prefix
            backend:
              service:
                name: comtrya-server
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: comtrya-frontend
                port:
                  number: 80
