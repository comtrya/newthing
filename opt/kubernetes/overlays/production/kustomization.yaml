apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: comtrya

resources:
  - ../../base
  - ingress.yaml

# Pin the released image by digest for production:
#   images:
#     - name: ghcr.io/comtrya/comtrya-server
#       digest: sha256:REPLACE

# Point the instance at your real config repo without editing the base.
# Strategic-merge over base/configmap.yaml (it is a plain ConfigMap resource).
patches:
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: comtrya-server-config
      data:
        COMTRYA_CONFIG_REPO_URL: https://github.com/your-org/comtrya-config.git
        COMTRYA_CONFIG_REPO_REF: main
        COMTRYA_CONFIG_REPO_PATH: ""
