# TEMPLATE SECRET — contains placeholders only, no real credentials.
#
# Replace the values before applying, or (recommended for production) delete
# this file from the kustomization and supply the same keys via your secret
# manager (External Secrets, Sealed Secrets, SOPS, Vault Agent, …) under the
# name `comtrya-server-secrets`.
#
# Keys:
#   COMTRYA_OPERATOR_CODE      break-glass operator code (>= 12 chars in
#                              production); mints an admin session without OIDC.
#   COMTRYA_CONFIG_REPO_TOKEN  PAT for cloning a private HTTPS config repo.
#                              (For SSH instead, set COMTRYA_CONFIG_REPO_SSH_KEY
#                              to the private key and, if needed,
#                              COMTRYA_CONFIG_REPO_SSH_PASSPHRASE.)
apiVersion: v1
kind: Secret
metadata:
  name: comtrya-server-secrets
type: Opaque
stringData:
  COMTRYA_OPERATOR_CODE: "REPLACE_WITH_A_STRONG_OPERATOR_CODE"
  COMTRYA_CONFIG_REPO_TOKEN: "REPLACE_WITH_GIT_TOKEN_OR_REMOVE_IF_PUBLIC"
