apiVersion: v1
kind: ConfigMap
metadata:
  name: comtrya-server-config
data:
  # Bind on all interfaces inside the pod; the Service/Ingress front it.
  COMTRYA_LISTEN: "0.0.0.0:8080"
  # The pod runs behind a TLS-terminating Ingress/proxy.
  COMTRYA_TLS_TERMINATED: "true"
  # Persistent state lives on the mounted PVC (see pvc.yaml + the volumeMount).
  COMTRYA_DATA_DIR: "/app/data"

  # ---- GitOps configuration (pure GitOps: the CUE repo is the source of
  # truth for OIDC, admins, repositories, labels, and extensions). REPLACE the
  # URL with your config repo; private repos also need COMTRYA_CONFIG_REPO_TOKEN
  # (or an SSH key) in the Secret. The server clones this on startup and
  # re-syncs on the interval below. ----
  COMTRYA_CONFIG_REPO_URL: "https://github.com/your-org/comtrya-config.git"
  COMTRYA_CONFIG_REPO_REF: "main"
  COMTRYA_CONFIG_SYNC_INTERVAL_SECONDS: "900"
  # Optional: username for HTTPS token auth (defaults to a generic git user).
  COMTRYA_CONFIG_REPO_USERNAME: ""

  COMTRYA_SESSION_TTL_SECONDS: "300"
  RUST_LOG: "info"
  COMTRYA_LOG_FORMAT: "json"
