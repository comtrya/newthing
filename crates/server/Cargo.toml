[package]
name = "comtrya-server"
version.workspace = true
edition.workspace = true
build = "build.rs"

[build-dependencies]
comtrya-wit-codegen = { path = "../wit-codegen" }
serde_json = "1"

[dependencies]
anyhow = "1"
argon2 = "0.5"
async-stream = "0.3"
axum = "0.7.9"
base64 = "0.22"
futures = "0.3"
tower-http = { version = "0.6", default-features = false, features = ["limit", "set-header"] }
bytes = "1"
comtrya-core = { path = "../core" }
comtrya-git-http = { path = "../git-http" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
subtle = "2"
tokio = { version = "1.52.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
wasmtime = { version = "43", default-features = false, features = ["anyhow", "component-model", "cranelift", "runtime", "std", "wat"] }
jsonschema = { version = "0.18", default-features = false }
cuengine = "0.40"
# `accept-rfc3339-timestamps` lets the verifier accept RFC3339 string
# timestamps (e.g. better-auth emits `updated_at` as an ISO-8601 string, not the
# spec's NumericDate). Without it the whole token response fails to parse.
openidconnect = { version = "4.0.1", features = ["accept-rfc3339-timestamps"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "json"] }
getrandom = "0.3"
# Bundled SQLite for the persistence store (sessions, credentials,
# rate-limit counters, future durable schema). `bundled` ships a vendored
# libsqlite3 so a fresh `./start.sh --reset` works without a system dep.
rusqlite = { version = "0.32", features = ["bundled"] }
# GitOps config-sync engine. Pinned to the git `main` branch until the
# v2.0.0 tag lands. gitsync is pure-Rust (gix) — matching the rest of the
# repo, no system libgit2 — and re-exports `gitsync::Oid` so we don't need a
# direct gix dependency. Note: it shells out to the `git` binary for
# checkout/reset, so a `git` executable must be on PATH at runtime.
gitsync = { git = "https://github.com/rawkode/gitsync", branch = "main" }
tempfile = "3"
