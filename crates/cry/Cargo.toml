[package]
name = "comtrya-cry"
version.workspace = true
edition.workspace = true

[[bin]]
name = "cry"
path = "src/main.rs"

[dependencies]
anyhow = "1"
tokio = { version = "1.52.1", features = ["macros", "rt-multi-thread", "time", "net", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
keyring = { version = "3.0.0", default-features = false, features = ["apple-native", "linux-native"] }
