[package]
name = "comtrya-wit-codegen"
version.workspace = true
edition.workspace = true

[lib]
name = "comtrya_wit_codegen"
path = "src/lib.rs"

[[bin]]
name = "wit-codegen"
path = "src/main.rs"

[dependencies]
wit-parser = "0.235"
anyhow = "1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
