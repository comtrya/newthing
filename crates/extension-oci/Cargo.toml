[package]
name = "comtrya-extension-oci"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1"
oci-distribution = { version = "0.11", default-features = false, features = ["rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tracing = "0.1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt", "sync", "time"] }

[dev-dependencies]
tempfile = "3"
