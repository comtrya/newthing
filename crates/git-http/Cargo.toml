[package]
name = "comtrya-git-http"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
axum = { version = "0.7.9" }
bytes = "1"
flate2 = "1"
futures = "0.3"
gix = { version = "0.73.0", features = ["blocking-network-client"] }
metrics = "0.23"
rand = "0.8"
sha1 = "0.10"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "time", "sync"] }
tokio-stream = "0.1"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
